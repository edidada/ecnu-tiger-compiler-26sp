name: Tiger Lab6 register allocation
on:
  push:
    branches: [edidada/lab6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install generators
        run: sudo apt-get update && sudo apt-get install -y flexc++ bisonc++
      - name: Verify RA on official 20, extended 35, boundaries, metadata and Lab5-1 regression
        run: timeout 1500 python3 -u scripts/verify_lab6.py || { tail -40 reports/lab6-results/build.log 2>/dev/null; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-lab6-results
          path: |
            reports/lab6-results/
            reports/lab5-1-results/
          if-no-files-found: warn
