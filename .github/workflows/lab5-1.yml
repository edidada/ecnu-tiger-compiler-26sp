name: Tiger Lab5-1 escape frames and IR
on:
  push:
    branches: [edidada/lab5-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab5-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install generators
        run: sudo apt-get update && sudo apt-get install -y flexc++ bisonc++
      - name: Build Release and verify official AST plus generated IR
        run: python3 scripts/verify_lab5_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-lab5-1-results
          path: reports/lab5-1-results/
          if-no-files-found: warn
