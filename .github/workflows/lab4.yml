name: Tiger Lab4 semantic analysis
on:
  push:
    branches: [edidada/lab4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install generators
        run: sudo apt-get update && sudo apt-get install -y flexc++ bisonc++
      - name: Build Release and check types and diagnostics
        run: python3 scripts/verify_lab4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-lab4-results
          path: reports/lab4-results/
          if-no-files-found: warn
